# /nginx.conf
# Add websocket upgrade support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # Nginx will listen on this port inside the container.
    # Fly.io will send all traffic here.
    listen 8080;

    # Route 1: Handle the Telegram webhook
    location /api/v1/watchers-telegram-server/ {
        # Forward the request to the Telegram server running on port 8001
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Timeouts for long-lived connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Route 2: Handle all other requests (the main API)
    location / {
        # Forward the request to the main API server running on port 8000
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Timeouts for long-lived connections (WebSocket/SSE)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Buffer settings for SSE
        proxy_buffering off;
        proxy_cache off;
    }
}