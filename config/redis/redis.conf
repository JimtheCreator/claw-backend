# Custom Redis config for Claw-Backend
bind 0.0.0.0
port 6379
timeout 300
databases 3
maxmemory 1gb
maxmemory-policy noeviction

# Durable notification streams must never be evicted as cache entries.
appendonly yes
appendfsync always

# Save after 15min if 1+ key changed
save 900 1    

# Save after 5min if 10+ keys changed
save 300 10
